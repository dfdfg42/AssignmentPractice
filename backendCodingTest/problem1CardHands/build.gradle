plugins {
	id 'java'
	id 'application'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

application {
	mainClass = 'com.example.cardhands.CardHandJudge'
}

tasks.named('run') {
	standardInput = System.in
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = 'UTF-8'
}
